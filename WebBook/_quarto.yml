project:
  type: book
  output-dir: ../_build/book

book:
  title: "Computational Geodynamics Primer"
  author:
    - "Louis Moresi"
  date: today
  bread-crumbs: True
  chapters:
    - part: "Preface"
      chapters:
        - index.qmd

    # Core content - to be organized
    - part: "**Part I: Mathematical Fundamentals**"
      chapters:
        - Part1-Fundamentals/placeholder.qmd

    - part: "**Part II: Fluid Dynamics**"
      chapters:
        - Part2-FluidDynamics/placeholder.qmd
        - Part2-FluidDynamics/inviscid-flows.qmd

    - part: "**Part III: Geodynamics**"
      chapters:
        # NB: Quarto books do not allow nested `section:` groups inside a part;
        # a part's `chapters:` must be a flat list of files.
        - Part3-Geodynamics/placeholder.qmd
        # Theme 1: Heat Transfer
        # - Part3-Geodynamics/heat-fundamentals.qmd
        # - Part3-Geodynamics/heat-analytical.qmd
        # - Part3-Geodynamics/heat-applications.qmd
        # Theme 2: Mantle Convection
        # - Part3-Geodynamics/convection-setup.qmd
        # - Part3-Geodynamics/convection-simple.qmd
        # - Part3-Geodynamics/convection-earth.qmd

    - part: "**Part IV: Numerical Methods**"
      chapters:
        # Stable file names: these URLs are cited from outside the book.
        - Part4-NumericalMethods/index.qmd
        - Part4-NumericalMethods/time-integration.qmd
        - Part4-NumericalMethods/survey-of-methods.qmd
        - Part4-NumericalMethods/fem-introduction.qmd
        - Part4-NumericalMethods/fem-practice.qmd
        - Part4-NumericalMethods/solvers.qmd

    - part: "**Part V: Computational Exercises**"
      chapters:
        - Part5-Computational/placeholder.qmd
        # Benchmarks & Tests
        - Part5-Computational/Benchmarks/analytical-solutions.qmd
        # - Part5-Computational/Benchmarks/numerical-convergence.qmd
        # Python Notebooks
        # - Part5-Computational/notebooks-heat.qmd
        # - Part5-Computational/notebooks-flow.qmd

    # Draft material (being reorganised into the parts above)
    - part: "**Draft Material (Being Reorganized)**"
      chapters:
        # Mathematical & Physical Foundations
        - DraftMaterial/ContinuumMechanics.qmd
        # Fluid Dynamics Equations
        - DraftMaterial/NavierStokes.qmd
        - DraftMaterial/StokesFlowApplications.qmd
        # Geodynamic Applications
        - DraftMaterial/ThermalConvection.qmd
        - DraftMaterial/MantleDynamics.qmd
        - DraftMaterial/LithosphericDynamics.qmd
        # (Numerical Methods promoted to Part IV)

    # References
    - part: "References"
      chapters:
        - summary.qmd
        - references.qmd

    # Contributions
    - part: "Contributing"
      chapters:
        - Contributions/contributing.qmd
        - Contributions/style-guide.qmd
        - Contributions/example-citations.qmd

  # Uncomment when you add slides
  # - part: "Slides"
  #   chapters:
  #     - LectureSlides/Lecture1.qmd

  appendices:
    - Notebooks/BinderLandingPage.qmd
    - Notebooks/TestNB1.ipynb
    - Notebooks/TestQMD_NB1.qmd

  navbar:
    search: true
    logo: assets/ANU-logo.png
    background: "#C58812"  # ANU honey colour
    foreground: white
    left:
      - text: "Introduction"
        href: index.qmd
      - text: "Details"
        href: summary.qmd
      - text: "Slides"
        href: LectureSlides/Lecture1.qmd
    right:
      - icon: github
        href: https://github.com/ANU-RSES-Education/Computational-Geodynamics-Primer
        aria-label: GitHub

  sidebar:
    logo: assets/AuWorldEQ.jpg
    style: "docked"
    background: light
    collapse-level: 2

bibliography: references.bib

execute:
  enabled: false

format:
  live-html:
    theme: [cosmo, "assets/theme.scss"]
    css: assets/styles.css
    toc: true
    toc-depth: 3
    code-copy: true
    code-fold: false
    linkcolor: "#C58812"
    number-sections: false
    number-depth: 1
    # Math rendering
    html-math-method: mathjax
    include-in-header:
      - text: |
          <script>
          window.MathJax = {
            tex: {
              tags: 'ams',
              packages: {'[+]': ['ams', 'amsmath', 'amssymb', 'color', 'newcommand', 'boldsymbol']},
              inlineMath: [['$', '$'], ['\\(', '\\)']],
              displayMath: [['$$', '$$'], ['\\[', '\\]']],
              macros: {
                dGamma: "{\\mathbf{d}\\boldsymbol{\\Gamma}}",
                uv: "{\\mathbf{u}}",
                vv: "{\\mathbf{v}}",
                DIV: "{\\nabla\\cdot}",
                GRAD: "{\\nabla}",
                CURL: "{\\nabla\\times}"
              }
            }
          };
          </script>

    # code-links:
    #   - text: Open in Binder
    #     icon: rocket-takeoff
    #     href: https://mybinder.org/v2/gh/ANU-RSES-Education/EMSC-QuartoBook/HEAD?labpath=WebBook/Notebooks%2FBinderLandingPage.qmd

    other-links:
      - text: Github Repository
        icon: github
        href: https://github.com/ANU-RSES-Education/Computational-Geodynamics-Primer

  # pdf:
  #   documentclass: scrreprt

pyodide:
  packages:
    - micropip
    - netcdf4
    - xarray
    - pydap
    - jinja2
    - ssl
    - owslib
