  appendices:
    - Notebooks/BinderLandingPage.qmd
    - Notebooks/TestNB1.ipynb
    - Notebooks/TestQMD_NB1.qmd

  navbar:
    search: true
    logo: assets/ANU-logo.png
    background: "#C58812"  # ANU honey colour
    foreground: white
    left:
      - text: "Introduction"
        href: index.qmd
      - text: "Details"
        href: summary.qmd
      - text: "Slides"
        href: LectureSlides/Lecture1.qmd
    right:
      - icon: github
        href: https://github.com/ANU-RSES-Education/Computational-Geodynamics-Primer
        aria-label: GitHub

  sidebar:
    logo: assets/AuWorldEQ.jpg
    style: "docked"
    background: light
    collapse-level: 2

bibliography: references.bib

execute:
  enabled: false

format:
  live-html:
    theme: [cosmo, "assets/theme.scss"]
    css: assets/styles.css
    toc: true
    toc-depth: 3
    code-copy: true
    code-fold: false
    linkcolor: "#C58812"
    number-sections: false
    number-depth: 1
    # Math rendering
    html-math-method: mathjax
    include-in-header:
      - text: |
          <script>
          window.MathJax = {
            tex: {
              tags: 'ams',
              packages: {'[+]': ['ams', 'amsmath', 'amssymb', 'color', 'newcommand', 'boldsymbol']},
              inlineMath: [['$', '$'], ['\\(', '\\)']],
              displayMath: [['$$', '$$'], ['\\[', '\\]']],
              macros: {
                dGamma: "{\\mathbf{d}\\boldsymbol{\\Gamma}}",
                uv: "{\\mathbf{u}}",
                vv: "{\\mathbf{v}}",
                DIV: "{\\nabla\\cdot}",
                GRAD: "{\\nabla}",
                CURL: "{\\nabla\\times}"
              }
            }
          };
          </script>

    # code-links:
    #   - text: Open in Binder
    #     icon: rocket-takeoff
    #     href: https://mybinder.org/v2/gh/ANU-RSES-Education/EMSC-QuartoBook/HEAD?labpath=WebBook/Notebooks%2FBinderLandingPage.qmd

    other-links:
      - text: Github Repository
        icon: github
        href: https://github.com/ANU-RSES-Education/Computational-Geodynamics-Primer

  # pdf:
  #   documentclass: scrreprt

pyodide:
  packages:
    - micropip
    - netcdf4
    - xarray
