name: Publish book (MyST)
# Builds WebBook/ with MyST and publishes it to gh-pages under /book, the URL
# the Quarto build used. keep_files leaves the JupyterLite site (deployed by
# jupyterlite.yml to the same branch) in place.

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: publish-book
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Same pinned toolchain as local builds (pixi.toml / pixi.lock).
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true

      # A project site is served under /<repo>/book, so MyST has to be told at
      # build time or every root-relative asset 404s.
      - name: Build
        env:
          BASE_URL: /${{ github.event.repository.name }}/book
        run: pixi run build

      - name: Deploy to gh-pages/book
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: WebBook/_build/html
          destination_dir: book
          keep_files: true
