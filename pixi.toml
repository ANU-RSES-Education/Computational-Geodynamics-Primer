[workspace]
authors = ["Louis Moresi <louis.moresi@anu.edu.au>"]
channels = ["conda-forge"]
name = "Zero-2-Pyrogrammer-for-Earth-Sciences"
platforms = ["osx-arm64"]
version = "0.1.0"

[dependencies]
jupyterlite = ">=0.5.1,<0.6"
jupyterlite-pyodide-kernel = ">=0.5.2,<0.6"
ipython = ">=9.4.0,<10"
ipykernel = ">=6.30.1,<7"
nbformat = ">=5.10.4,<6"
nbclient = ">=0.10.2,<0.11"
yaml = ">=0.2.5,<0.3"
pyyaml = ">=6.0.2,<7"
typst = "0.13.*"
matplotlib = ">=3.9"
numpy = ">=2"
mystmd = "==1.10.1"
nodejs = ">=20"
scipy = ">=1.13"
jupytext = ">=1.16"

[tasks]
figures = "python -I WebBook/Images/Diagrams/src/build_figures.py"
start = { cmd = "myst start", cwd = "WebBook" }
build = { cmd = "myst build --html", cwd = "WebBook" }
build-exam = { cmd = "python -I scripts/build_exam.py", cwd = "WebBook" }
